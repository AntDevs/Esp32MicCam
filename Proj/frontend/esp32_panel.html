<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Sense mDNS Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-4xl mx-auto bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
        <h1 class="text-2xl font-bold mb-6 flex items-center gap-3">
            <i class="fa-solid fa-network-wired text-indigo-400"></i> Панель управления ESP32 по mDNS
        </h1>

        <!-- Блок настройки mDNS хоста -->
        <div class="mb-6 bg-slate-900 p-4 rounded-lg border border-slate-700 flex gap-4 items-center">
            <label for="espHost" class="text-sm font-semibold">mDNS Хост:</label>
            <input type="text" id="espHost" value="esp32-door-cam.local" class="bg-slate-800 border border-slate-600 rounded px-3 py-1.5 text-sm flex-1 font-mono text-emerald-400">
            <button onclick="applyHost()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-sm rounded font-medium transition">Применить</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Секция Видео (Камера) -->
            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 flex flex-col items-center">
                <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-video text-emerald-400"></i> Видеопоток (порт 81)
                </h2>
                <div class="w-full aspect-video bg-black rounded overflow-hidden flex items-center justify-center border border-slate-800 relative">
                    <img id="streamImg" src="" alt="Camera Stream" class="w-full h-full object-cover hidden">
                    <span id="streamPlaceholder" class="text-slate-500 text-sm">Поток выключен</span>
                </div>
                <div class="flex gap-2 mt-4 w-full">
                    <button onclick="startVideo()" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-sm font-medium transition">Запустить</button>
                    <button onclick="stopVideo()" class="flex-1 py-2 bg-rose-600 hover:bg-rose-500 text-sm font-medium transition">Остановить</button>
                </div>
            </div>

            <!-- Секция Аудио (Микрофон) -->
            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-microphone text-sky-400"></i> Потоковый микрофон
                    </h2>
                    <p class="text-xs text-slate-400 mb-4">Управление через эндпоинты <code class="text-sky-300">/mic/start</code> и <code class="text-sky-300">/mic/stop</code>:</p>
                    
                    <div class="flex gap-2 mb-4">
                        <button onclick="startMicStream()" id="startMicBtn" class="flex-1 py-2.5 bg-sky-600 hover:bg-sky-500 text-sm font-medium rounded transition">
                            <i class="fa-solid fa-circle-dot mr-1 text-rose-400"></i> Начать запись
                        </button>
                        <button onclick="stopMicStream()" id="stopMicBtn" disabled class="flex-1 py-2.5 bg-slate-700 text-slate-400 text-sm font-medium rounded transition cursor-not-allowed">
                            <i class="fa-solid fa-stop mr-1"></i> Остановить
                        </button>
                    </div>

                    <audio id="micAudioPlayer" controls class="w-full hidden mb-2"></audio>
                </div>

                <div class="mt-4 pt-4 border-t border-slate-800">
                    <span id="audioStatus" class="text-xs text-slate-400">Статус: Готов</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (window.location.hostname && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") {
                document.getElementById('espHost').value = window.location.hostname;
            }
        };

        function getHost() {
            let host = document.getElementById('espHost').value.trim();
            host = host.replace(/^https?:\/\//, '');
            host = host.replace(/\/\$/, '');
            return host;
        }

        function applyHost() {
            const host = getHost();
            console.log("[INFO] Установлен новый mDNS хост:", host);
            alert("Хост изменен на: " + host);
        }

        function startVideo() {
            const host = getHost();
            const img = document.getElementById('streamImg');
            const placeholder = document.getElementById('streamPlaceholder');
            img.src = `http://${host}:81/stream`;
            img.classList.remove('hidden');
            placeholder.classList.add('hidden');
        }

        function stopVideo() {
            const img = document.getElementById('streamImg');
            const placeholder = document.getElementById('streamPlaceholder');
            img.src = "";
            img.classList.add('hidden');
            placeholder.classList.remove('hidden');
        }

        let micAbortController = null;
        let recordedChunks = [];

        async function startMicStream() {
            const host = getHost();
            const status = document.getElementById('audioStatus');
            const player = document.getElementById('micAudioPlayer');
            const startBtn = document.getElementById('startMicBtn');
            const stopBtn = document.getElementById('stopMicBtn');

            recordedChunks = [];
            player.classList.add('hidden');
            micAbortController = new AbortController();

            status.innerText = "Запись потока с микрофона...";
            status.style.color = "#38bdf8";

            startBtn.disabled = true;
            startBtn.classList.remove('bg-sky-600', 'hover:bg-sky-500');
            startBtn.classList.add('bg-slate-700', 'text-slate-500', 'cursor-not-allowed');

            stopBtn.disabled = false;
            stopBtn.classList.remove('bg-slate-700', 'text-slate-400', 'cursor-not-allowed');
            stopBtn.classList.add('bg-rose-600', 'hover:bg-rose-500');

            try {
                const response = await fetch(`http://${host}/mic/start`, {
                    signal: micAbortController.signal
                });
                if (!response.ok) throw new Error("Не удалось запустить потоковую запись");

                const reader = response.body.getReader();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    if (value) {
                        recordedChunks.push(value);
                    }
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error("[ERROR] Mic stream error:", err);
                }
            } finally {
                processRecordedAudio();
            }
        }

        async function stopMicStream() {
            const host = getHost();
            const status = document.getElementById('audioStatus');
            
            status.innerText = "Остановка записи...";
            status.style.color = "#f59e0b";

            try {
                await fetch(`http://${host}/mic/stop`);
            } catch (err) {
                console.error("[ERROR] Failed to send stop signal:", err);
            }

            if (micAbortController) {
                micAbortController.abort();
            }
        }

        function processRecordedAudio() {
            const status = document.getElementById('audioStatus');
            const player = document.getElementById('micAudioPlayer');
            const startBtn = document.getElementById('startMicBtn');
            const stopBtn = document.getElementById('stopMicBtn');

            startBtn.disabled = false;
            startBtn.classList.remove('bg-slate-700', 'text-slate-500', 'cursor-not-allowed');
            startBtn.classList.add('bg-sky-600', 'hover:bg-sky-500');

            stopBtn.disabled = true;
            stopBtn.classList.remove('bg-rose-600', 'hover:bg-rose-500');
            stopBtn.classList.add('bg-slate-700', 'text-slate-400', 'cursor-not-allowed');

            if (recordedChunks.length === 0) {
                status.innerText = "Запись пуста или остановлена.";
                status.style.color = "#f43f5e";
                return;
            }

            const totalLength = recordedChunks.reduce((acc, chunk) => acc + chunk.length, 0);
            const pcmData = new Uint8Array(totalLength);
            let offset = 0;
            for (const chunk of recordedChunks) {
                pcmData.set(chunk, offset);
                offset += chunk.length;
            }

            const sampleRate = 16000;
            const channels = 1;
            const bitsPerSample = 16;
            const dataSize = pcmData.length;
            const chunkSize = 36 + dataSize;
            const byteRate = sampleRate * channels * (bitsPerSample / 8);
            const blockAlign = channels * (bitsPerSample / 8);

            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            
            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            writeString(view, 0, 'RIFF');
            view.setUint32(4, chunkSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, channels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            const wavBlob = new Blob([wavHeader, pcmData], { type: 'audio/wav' });
            player.src = URL.createObjectURL(wavBlob);
            player.classList.remove('hidden');
            player.play();

            status.innerText = `Запись завершена (${(dataSize / (sampleRate * 2)).toFixed(1)} сек). Воспроизведение...`;
            status.style.color = "#4ade80";
        }
    </script>
</body>
</html>
