<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Sense mDNS Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-4xl mx-auto bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
        <h1 class="text-2xl font-bold mb-6 flex items-center gap-3">
            <i class="fa-solid fa-network-wired text-indigo-400"></i> Панель управления ESP32 по mDNS
        </h1>

        <div class="mb-6 bg-slate-900 p-4 rounded-lg border border-slate-700 flex gap-4 items-center">
            <label for="espHost" class="text-sm font-semibold">mDNS Хост:</label>
            <input type="text" id="espHost" value="esp32-door-cam.local" class="bg-slate-800 border border-slate-600 rounded px-3 py-1.5 text-sm flex-1 font-mono text-emerald-400">
            <button onclick="applyHost()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-sm rounded font-medium transition">Применить</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Секция Видео (Камера) -->
            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 flex flex-col items-center">
                <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-video text-emerald-400"></i> Видеопоток (порт 81)
                </h2>
                <div class="w-full aspect-video bg-black rounded overflow-hidden flex items-center justify-center border border-slate-800 relative">
                    <img id="streamImg" src="" alt="Camera Stream" class="w-full h-full object-cover hidden">
                    <span id="streamPlaceholder" class="text-slate-500 text-sm">Поток выключен</span>
                </div>
                <div class="flex gap-2 mt-4 w-full">
                    <button onclick="startVideo()" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-sm font-medium transition">Запустить</button>
                    <button onclick="stopVideo()" class="flex-1 py-2 bg-rose-600 hover:bg-rose-500 text-sm font-medium transition">Остановить</button>
                </div>
            </div>

            <!-- Секция Аудио (Микрофон) -->
            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-microphone text-sky-400"></i> Потоковый микрофон
                    </h2>
                    
                    <div class="flex gap-2 mb-4">
                        <button onclick="startMicStream()" id="startMicBtn" class="flex-1 py-2.5 bg-sky-600 hover:bg-sky-500 text-sm font-medium rounded transition">
                            <i class="fa-solid fa-circle-dot mr-1 text-rose-400"></i> Начать запись
                        </button>
                        <button onclick="stopMicStream()" id="stopMicBtn" disabled class="flex-1 py-2.5 bg-slate-700 text-slate-400 text-sm font-medium rounded transition cursor-not-allowed">
                            <i class="fa-solid fa-stop mr-1"></i> Остановить
                        </button>
                    </div>

                    <audio id="micAudioPlayer" controls class="w-full hidden mb-2"></audio>
                </div>

                <div class="mt-4 pt-4 border-t border-slate-800">
                    <span id="audioStatus" class="text-xs text-slate-400">Статус: Готов</span>
                </div>
            </div>

            <!-- РАЗДЕЛЕНИЕ: Проигрывание потока на динамик -->
            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 mt-4 md:col-span-2">
                <h3 class="text-sm font-semibold mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-volume-high text-fuchsia-400"></i> Проиграть аудио (стриминг на динамик на лету)
                </h3>
                <input type="file" id="audioStreamInput" accept=".wav" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-fuchsia-600 file:text-white hover:file:bg-fuchsia-500 mb-2 cursor-pointer transition">
                <button onclick="streamAudioFile()" id="streamAudioBtn" class="w-full py-2.5 bg-slate-700 hover:bg-fuchsia-600 text-slate-200 text-sm font-medium rounded transition">
                    <i class="fa-solid fa-play mr-1"></i> Транслировать звуковой поток
                </button>
            </div> 
            
            <!-- РАЗДЕЛЕНИЕ: Сохранение файла на диск -->
            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 mt-4 md:col-span-2">
                <h3 class="text-sm font-semibold mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-save text-emerald-400"></i> Загрузить файл на диск ESP32 (сохранение)
                </h3>
                <input type="file" id="audioUploadInput" accept=".wav" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 mb-2 cursor-pointer transition">
                <button onclick="uploadAudioFile()" id="uploadAudioBtn" class="w-full py-2.5 bg-slate-700 hover:bg-emerald-600 text-slate-200 text-sm font-medium rounded transition">
                    <i class="fa-solid fa-upload mr-1"></i> Сохранить файл в память устройства
                </button>
            </div>            
        </div>
    </div>

    <script>
        window.onload = function() {
            if (window.location.hostname && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") {
                document.getElementById('espHost').value = window.location.hostname;
            }
        };

        function getHost() {
            let host = document.getElementById('espHost').value.trim();
            host = host.replace(/^https?:\/\//, '');
            host = host.replace(/\/\$/, '');
            return host;
        }

        function applyHost() {
            const host = getHost();
            alert("Хост изменен на: " + host);
        }

        function startVideo() {
            const host = getHost();
            const img = document.getElementById('streamImg');
            const placeholder = document.getElementById('streamPlaceholder');
            img.src = `http://${host}:81/stream`;
            img.classList.remove('hidden');
            placeholder.classList.add('hidden');
        }

        function stopVideo() {
            const img = document.getElementById('streamImg');
            const placeholder = document.getElementById('streamPlaceholder');
            img.src = "";
            img.classList.add('hidden');
            placeholder.classList.remove('hidden');
        }

        let micAbortController = null;
        let recordedChunks = [];

        async function startMicStream() { /* Логика прежняя */ }
        async function stopMicStream() { /* Логика прежняя */ }
        function processRecordedAudio() { /* Логика прежняя */ }

        // ЭНДПОИНТ 1: ПОТОКОВОЕ ПРОИГРЫВАНИЕ
        async function streamAudioFile() {
            const fileInput = document.getElementById('audioStreamInput');
            const file = fileInput.files[0];
            const status = document.getElementById('audioStatus');
            const btn = document.getElementById('streamAudioBtn');

            if (!file) {
                status.innerText = "Ошибка: Сначала выберите WAV файл."; return;
            }

            const host = getHost();
            status.innerText = "Трансляция аудио на динамик ESP32...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append("audioFile", file);

            try {
                const response = await fetch(`http://${host}/api/stream_play`, { method: 'POST', body: formData });
                if (response.ok) {
                    status.innerText = "Успешно: поток завершен!";
                } else {
                    status.innerText = "Ошибка: " + await response.text();
                }
            } catch (err) {
                status.innerText = "Ошибка сети.";
            } finally {
                btn.disabled = false;
            }
        }

        // ЭНДПОИНТ 2: ЗАГРУЗКА ФАЙЛА
        async function uploadAudioFile() {
            const fileInput = document.getElementById('audioUploadInput');
            const file = fileInput.files[0];
            const status = document.getElementById('audioStatus');
            const btn = document.getElementById('uploadAudioBtn');

            if (!file) {
                status.innerText = "Ошибка: Сначала выберите WAV файл."; return;
            }

            const host = getHost();
            status.innerText = "Загрузка файла в память ESP32...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append("audioFile", file);

            try {
                const response = await fetch(`http://${host}/api/upload`, { method: 'POST', body: formData });
                if (response.ok) {
                    status.innerText = "Успешно: файл сохранен в память!";
                } else {
                    status.innerText = "Ошибка сохранения: " + await response.text();
                }
            } catch (err) {
                status.innerText = "Ошибка сети при загрузке.";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
